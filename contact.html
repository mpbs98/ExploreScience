  <main class="container py-5 mt-5 text-center">
    <h2 class="mb-4">Contact Us / Newsletter</h2>
    <p class="mb-5 text-primary">Join our newsletter or send us a message!</p>

    <div class="form-container text-start">
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="John Doe" autocomplete="autocomplete" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="example@email.com"
            autocomplete="autocomplete" required>
        </div>

        <div class="mb-3">
          <label for="topic" class="form-label">Topic</label>
          <select id="topic" class="form-select" required>
            <option selected disabled value="">Choose...</option>
            <option>General Question</option>
            <option>Collaboration Inquiry</option>
            <option>Feedback</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..."></textarea>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" value="" id="newsletterCheck">
          <label class="form-check-label" for="newsletterCheck">
            Subscribe to our monthly science newsletter
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send"></i> Submit</button>
      </form>
    </div>
  </main>
